<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzzkill · Leaderboard</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; max-width: 800px; margin: 40px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #2a2a2a; }
    th { color: #888; font-weight: 500; font-size: 14px; }
    td.num { font-variant-numeric: tabular-nums; }
    .up { color: #6fdc8c; } .down { color: #ff7a7a; }
    .wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Most focused</h1>
  <p>Ranked by fewest phone pickups per hour.</p>
  <div class="wrap">
    <table>
      <thead>
        <tr><th>#</th><th>Player</th><th>Games</th><th>Pickups/hr</th><th>Clean %</th><th>Avg SOL</th><th>Total SOL</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const sol = n => n === null ? "–" : `<span class="${n >= 0 ? "up" : "down"}">${n >= 0 ? "+" : ""}${Number(n).toFixed(3)}</span>`;

    async function load() {
      const { data, error } = await sb.from("leaderboard").select("*");
      const rows = document.getElementById("rows");
      if (error) { rows.innerHTML = `<tr><td colspan="7">${error.message}</td></tr>`; return; }
      if (!data.length) { rows.innerHTML = `<tr><td colspan="7">No finished games yet.</td></tr>`; return; }
      rows.innerHTML = data.map((p, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${p.username}</td>
          <td class="num">${p.games}</td>
          <td class="num">${p.pickups_per_hour}</td>
          <td class="num">${p.clean_pct}%</td>
          <td class="num">${sol(p.avg_sol)}</td>
          <td class="num">${sol(p.total_sol)}</td>
        </tr>`).join("");
    }

    load();
    setInterval(load, 5000);   // refresh every 5 seconds
  </script>
</body>
</html>
