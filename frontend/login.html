<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzzkill · Log in</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 4px; }
    .tabs button { background: #222; color: #aaa; border: 0; padding: 10px 14px; border-radius: 8px; margin-right: 6px; }
    .tabs button.on { background: #f5c542; color: #111; font-weight: 600; }
    form { display: none; margin-top: 16px; }
    form.on { display: block; }
    input { width: 100%; box-sizing: border-box; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #333; background: #1b1b1b; color: #eee; font-size: 16px; }
    .go { width: 100%; padding: 12px; margin-top: 8px; border: 0; border-radius: 8px; background: #f5c542; color: #111; font-size: 16px; font-weight: 600; }
    .google { width: 100%; padding: 12px; margin-top: 20px; border: 1px solid #444; border-radius: 8px; background: #fff; color: #222; font-size: 16px; font-weight: 600; }
    .or { text-align: center; color: #666; margin: 16px 0 0; font-size: 14px; }
    #msg { margin-top: 14px; color: #ff7a7a; }
  </style>
</head>
<body>
  <h1>Buzzkill</h1>
  <p>Put the phone down. We're watching.</p>

  <button id="google" class="google">Continue with Google</button>
  <p class="or">or</p>

  <div class="tabs">
    <button data-tab="login" class="on">Log in</button>
    <button data-tab="signup">Sign up</button>
    <button data-tab="guest">Guest</button>
  </div>

  <form id="login" class="on">
    <input name="email" type="email" placeholder="Email" autocomplete="email" required>
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="go">Log in</button>
  </form>

  <form id="signup">
    <input name="username" placeholder="Username (shown on leaderboard)" maxlength="30" pattern="[A-Za-z0-9_.\-]{3,30}"
           title="3-30 letters, numbers, _ . -" autocomplete="username" required>
    <input name="email" type="email" placeholder="Email" autocomplete="email" required>
    <input name="password" type="password" placeholder="Password (8+ characters)" minlength="8" autocomplete="new-password" required>
    <button class="go">Create account</button>
  </form>

  <form id="guest">
    <input name="username" placeholder="Your name" maxlength="30" required>
    <button class="go">Play as guest</button>
  </form>

  <p id="msg"></p>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const msg = document.getElementById("msg");

    // Switch between the 3 forms
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      document.querySelectorAll(".tabs button, form").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      document.getElementById(b.dataset.tab).classList.add("on");
      msg.textContent = "";
    });

    // Where to go after logging in. Only pages on THIS site are allowed,
    // so nobody can make a link that logs you in and sends you to a fake site.
    function nextPage() {
      const next = new URLSearchParams(location.search).get("next") || "/leaderboard";
      return next.startsWith("/") && !next.startsWith("//") && !next.startsWith("/\\") ? next : "/leaderboard";
    }
    const done = () => location.href = nextPage();

    // GOOGLE
    document.getElementById("google").onclick = async () => {
      const { error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: location.origin + nextPage() },
      });
      if (error) msg.textContent = error.message;
    };

    // LOG IN
    document.getElementById("login").onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const { error } = await sb.auth.signInWithPassword({
        email: f.get("email").trim(),
        password: f.get("password"),
      });
      error ? msg.textContent = "Wrong email or password." : done();
    };

    // SIGN UP (username goes into the profile automatically)
    document.getElementById("signup").onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const username = f.get("username").trim();

      // Check the username isn't taken first
      const { data: taken } = await sb.from("profiles").select("id")
        .ilike("username", username.replace(/[%_\\]/g, "\\$&")).eq("is_guest", false).limit(1);
      if (taken?.length) { msg.textContent = "That username is taken."; return; }

      const { error } = await sb.auth.signUp({
        email: f.get("email").trim(),
        password: f.get("password"),
        options: { data: { username } },
      });
      error ? msg.textContent = error.message : done();
    };

    // GUEST (no email or password)
    document.getElementById("guest").onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const { error } = await sb.auth.signInAnonymously({
        options: { data: { username: f.get("username").trim() } },
      });
      error ? msg.textContent = error.message : done();
    };

    // Already logged in (e.g. coming back from Google)? Skip this page.
    sb.auth.getSession().then(({ data }) => { if (data.session) done(); });
  </script>
</body>
</html>
