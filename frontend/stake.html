<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bet SOL · Buzzkill</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --ink: #2B2109; --honey: #F5B700; --cream: #FFF8E6; --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--cream); color: var(--ink); font-family: var(--font); }
    main { width: 100%; max-width: 420px; text-align: center; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    .amount { font-size: 44px; font-weight: 900; margin: 18px 0 4px; }
    .sub { margin: 0 0 22px; color: #5A4710; }
    button { width: 100%; padding: 16px; border: 0; border-radius: 16px; background: var(--ink); color: #fff; font: 800 17px var(--font); cursor: pointer; }
    button:disabled { opacity: .5; }
    .note { margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: #fff; font-size: 14px; text-align: left; line-height: 1.45; }
    #msg { margin-top: 16px; font-weight: 700; min-height: 1.4em; }
    a { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <h1>🐝 Bet on yourself</h1>
    <p class="sub" id="game"></p>
    <div class="amount" id="amount"></div>
    <p class="sub">test SOL · last one standing takes the whole pot</p>
    <button id="pay">Approve in Phantom</button>
    <p id="msg" role="status"></p>
    <div class="note">
      <b>This is test SOL (devnet), not real money.</b><br>
      In Phantom: Settings → Developer Settings → turn on <b>Testnet Mode</b> and pick <b>Solana Devnet</b>.
      Need test SOL? Get some free at <a href="https://faucet.solana.com" target="_blank" rel="noopener">faucet.solana.com</a>.
    </div>
  </main>

  <script src="vendor/solana-web3.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const q = new URLSearchParams(location.search);
    const game = (q.get("game") || "").toUpperCase(), ref = q.get("ref") || "", pot = q.get("pot") || "";
    const amount = Number(q.get("amount"));
    const valid = /^[A-Z0-9]{4,12}$/.test(game) && amount >= 0.001 && amount <= 5
      && /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(ref) && /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(pot);

    $("game").textContent = `Game ${game}`;
    $("amount").textContent = `${amount} SOL`;
    if (!valid) { $("pay").disabled = true; $("msg").textContent = "This link is broken. Go back to the game and tap Bet again."; }

    $("pay").onclick = async () => {
      const phantom = window.phantom?.solana;
      if (!phantom?.isPhantom) {
        // Not inside Phantom: reopen this page in Phantom's browser
        location.href = `https://phantom.app/ul/browse/${encodeURIComponent(location.href)}?ref=${encodeURIComponent(location.origin)}`;
        return;
      }
      $("pay").disabled = true;
      $("msg").textContent = "Check Phantom to approve…";
      try {
        const { Connection, PublicKey, SystemProgram, Transaction, LAMPORTS_PER_SOL } = solanaWeb3;
        const { publicKey } = await phantom.connect();
        const conn = new Connection("https://api.devnet.solana.com", "confirmed");
        const ix = SystemProgram.transfer({ fromPubkey: publicKey, toPubkey: new PublicKey(pot), lamports: Math.round(amount * LAMPORTS_PER_SOL) });
        ix.keys.push({ pubkey: new PublicKey(ref), isSigner: false, isWritable: false });   // lets the game find this payment
        const tx = new Transaction().add(ix);
        tx.feePayer = publicKey;
        tx.recentBlockhash = (await conn.getLatestBlockhash()).blockhash;
        await phantom.signAndSendTransaction(tx);
        $("msg").textContent = "✅ Sent! Go back to your browser. Your bet shows up in a few seconds.";
      } catch (e) {
        $("pay").disabled = false;
        const m = String(e?.message || e);
        $("msg").textContent = /blockhash|not found|simulat/i.test(m)
          ? "That didn't go through. Is Phantom on Solana Devnet? (see below)"
          : /reject|cancel/i.test(m) ? "Cancelled. Tap the button to try again." : "That didn't work: " + m;
      }
    };
  </script>
</body>
</html>
