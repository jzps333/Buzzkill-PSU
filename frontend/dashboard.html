<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzzkill · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FFFAEB; --honey: #F5D35A; --sand: #F4EEDC; --peach: #F7E4BF;
      --ink: #1F1B16; --ink-2: #5E574B; --line: #EAE2CC; --white: #FFFFFF;
      --green: #2F8A55; --red: #B42323;
      --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--cream); color: var(--ink); font: 500 16px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 8px; }

    .wrap { width: min(1040px, 100% - 32px); margin: 0 auto; }

    /* Nav (same as the landing page) */
    .nav { display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--honey); display: grid; place-items: center; }
    .nav-links { display: flex; align-items: center; gap: 22px; font-size: 14px; font-weight: 700; }
    .nav-links a { text-decoration: none; }
    .nav-links a:hover { text-decoration: underline; }
    .pill { height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: var(--white); font: 700 14px var(--font); cursor: pointer; }
    .pill:hover { background: #3A332A; }

    main { width: min(600px, 100%); margin: 0 auto; padding: 8px 0 64px; }

    /* Hello */
    .hello { display: flex; align-items: center; gap: 16px; padding: 22px 24px; border-radius: 24px; background: var(--honey); }
    .hello .bee { flex: none; width: 74px; }
    .hello p { margin: 0; font-size: 14px; font-weight: 700; color: #5A4710; }
    .hello h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); line-height: 1.1; font-weight: 800; letter-spacing: -.8px; word-break: break-word; }
    .hello .tag { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.6); font-size: 12px; font-weight: 800; }

    .card { margin-top: 14px; padding: 22px 22px 20px; border: 1px solid var(--line); border-radius: 22px; background: var(--white); }
    .card.active { border: 0; background: var(--ink); color: var(--white); }
    .card.active .sub { color: #D8D0BE; }
    .card h2 { margin: 0 0 2px; font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
    .sub { margin: 0; font-size: 14px; color: var(--ink-2); }

    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 50px; margin-top: 14px;
      border: 0; border-radius: 999px;
      background: var(--ink); color: var(--white);
      font: 800 15px var(--font); text-decoration: none; cursor: pointer;
    }
    .btn:hover { background: #3A332A; }
    .btn.honey { background: var(--honey); color: var(--ink); }
    .btn.honey:hover { background: #E9BF2E; }
    .btn.ghost { background: var(--sand); color: var(--ink); }
    .btn.ghost:hover { background: #EBE3CC; }

    .code-box { display: flex; gap: 8px; margin-top: 14px; padding: 6px 6px 6px 18px; border: 2px solid var(--ink); border-radius: 16px; }
    .code-box input { flex: 1; min-width: 0; height: 46px; border: 0; outline: none; background: transparent; color: var(--ink); font: 800 20px var(--font); letter-spacing: 3px; text-transform: uppercase; }
    .code-box input::placeholder { color: #A39C8C; font-weight: 600; font-size: 17px; letter-spacing: 1px; text-transform: none; }
    .code-box .btn { width: auto; height: 46px; margin: 0; padding: 0 22px; border-radius: 11px; }

    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .stat { padding: 14px 16px; border-radius: 14px; background: var(--sand); }
    .stat b { display: block; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
    .stat span { font-size: 13px; color: var(--ink-2); font-weight: 600; }
    .stat small { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-2); }
    .stats-label { margin: 18px 0 0; font-size: 13px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-2); }
    .friends-pill { background: var(--honey); color: var(--ink); }
    .up { color: var(--green); } .down { color: var(--red); }
    .nemesis { margin-top: 12px; padding: 12px 16px; border-radius: 14px; background: var(--peach); font-size: 14px; font-weight: 600; }
    .empty { margin-top: 10px; font-size: 14px; color: var(--ink-2); }

    #msg { min-height: 1.4em; margin: 12px 0 0; text-align: center; font-size: 14px; font-weight: 700; color: var(--red); }

    @media (max-width: 560px) {
      .nav-links a:not(.friends-pill) { display: none; }
      .hello { padding: 18px; }
      .hello .bee { width: 58px; }
      .card { padding: 18px 16px; }
      .code-box { flex-direction: column; padding: 8px; }
      .code-box input { text-align: center; }
      .code-box .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 3c-3.6 0-6 2.7-6 6.3V14l-2 3h16l-2-3V9.3C18 5.7 15.6 3 12 3z" fill="#1F1B16"/><circle cx="12" cy="19.5" r="2.2" fill="#1F1B16"/></svg>
        </span>
        Buzzkill
      </a>
      <div class="nav-links">
        <a href="/#how">How it works</a>
        <a href="/#leaderboard">Leaderboard</a>
        <a class="pill friends-pill" href="/friends" id="friendsBtn">Friends</a>
        <button class="pill" id="logout">Log out</button>
      </div>
    </nav>
  </div>

  <main>
    <section class="hello">
      <div class="bee" id="bee"></div>
      <div>
        <p>Welcome back</p>
        <h1 id="name">…</h1>
        <span class="tag" id="guestTag" hidden>Guest</span>
      </div>
    </section>

    <!-- Shows only if you're already in a game -->
    <section class="card active" id="activeCard" hidden>
      <h2 id="activeTitle"></h2>
      <p class="sub" id="activeSub"></p>
      <a class="btn honey" id="activeBtn"></a>
    </section>

    <section class="card">
      <h2>Join a game</h2>
      <p class="sub">Tap your phone on the brick, or type the game PIN.</p>
      <form class="code-box" id="joinForm">
        <input id="code" maxlength="12" placeholder="Enter game PIN" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Game PIN" required>
        <button class="btn">Join</button>
      </form>
    </section>

    <section class="card">
      <h2>Host a game</h2>
      <p class="sub" id="hostSub">Start a session for your group (4+ players).</p>
      <a class="btn ghost" id="hostBtn" href="/host">Host a game</a>
    </section>

    <section class="card">
      <h2>Your stats</h2>
      <p class="empty" id="stats">Loading…</p>
      <div class="nemesis" id="nemesis" hidden></div>
      <a class="btn ghost" href="/leaderboard">See the full leaderboard</a>
    </section>

    <p id="msg" role="status"></p>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="device.js"></script>
  <script src="buzz.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

    Buzz.bee($("bee"));
    $("bee").classList.add("bz-float");

    async function init() {
      // 1. Must be logged in
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = "/login?next=/dashboard"; return; }
      const me = session.user.id;

      // 2. Name (textContent, so names can't run code)
      const { data: profile } = await sb.from("profiles").select("username, is_guest").eq("id", me).single();
      $("name").textContent = profile?.username ?? "player";

      // 3. Guests can play but not host
      if (profile?.is_guest) {
        $("guestTag").hidden = false;
        $("hostSub").textContent = "Guests can't host. Make an account to start your own games.";
        $("hostBtn").textContent = "Make an account";
        $("hostBtn").href = "/login?tab=signup&next=/dashboard";
      }

      // 4. Already in a game? Show a shortcut back to it.
      const { data: hosting } = await sb.from("games").select("code, status")
        .eq("host_id", me).in("status", ["waiting", "live"]).limit(1).maybeSingle();
      const { data: playing } = await sb.from("results").select("game, games!inner(status)")
        .eq("user_id", me).in("games.status", ["waiting", "live"]).limit(1).maybeSingle();

      if (hosting) {
        showActive(`You're hosting ${hosting.code}`, hosting.status === "live" ? "Game is live" : "Waiting for players", "Open host controls", "/host");
      } else if (playing) {
        showActive(`You're in game ${playing.game}`, playing.games.status === "live" ? "Game is live. Get back in!" : "Waiting to start", "Rejoin", "/join?room=" + encodeURIComponent(playing.game));
      }

      // 5. Stats, worked out from your finished games
      if (profile?.is_guest) {
        $("stats").textContent = "Guest stats aren't saved. Make an account to keep them.";
      } else {
        const { data: rows } = await sb.from("results")
          .select("pickups, pickup_times, games!inner(status, start_time, end_time)")
          .eq("user_id", me).eq("games.status", "ended");
        showStats((rows || []).filter(r => r.games.start_time && r.games.end_time));
      }

      // 6. Nemesis: the person you lose to most
      const { data: nem } = await sb.from("rivalries").select("opponent, wins, losses")
        .eq("user_id", me).gt("losses", 0).order("losses", { ascending: false }).limit(1).maybeSingle();
      // 7. Friend requests waiting for you
      if (!profile?.is_guest) {
        const { count } = await sb.from("friendships").select("id", { count: "exact", head: true })
          .eq("addressee", me).eq("status", "pending");
        if (count) $("friendsBtn").textContent = `Friends · ${count} new`;
      }

      if (nem) {
        $("nemesis").textContent = `Nemesis: ${nem.opponent}. You're ${nem.wins}–${nem.losses} against them.`;
        $("nemesis").hidden = false;
      }
    }

    // "1h 05m", "12m 30s", "45s"
    function dur(sec) {
      if (sec == null || !isFinite(sec)) return "—";
      sec = Math.round(sec);
      if (sec < 60) return `${sec}s`;
      const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
      return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(s).padStart(2, "0")}s`;
    }

    function showStats(games) {
      if (!games.length) { $("stats").textContent = "No finished games yet. Go play one!"; return; }
      games.sort((a, b) => new Date(a.games.end_time) - new Date(b.games.end_time));

      const seconds = g => (new Date(g.games.end_time) - new Date(g.games.start_time)) / 1000;
      const totalSec = games.reduce((t, g) => t + seconds(g), 0);
      const pickups = games.reduce((t, g) => t + g.pickups, 0);
      const clean = games.filter(g => g.pickups === 0).length;

      // Clean-game streaks (0 pickups in a row): the current one, and your best ever
      let run = 0, best = 0;
      for (const g of games) { run = g.pickups === 0 ? run + 1 : 0; best = Math.max(best, run); }

      // Focus stretches: time between game start, each pickup, and game end.
      // (Older games didn't save pickup times, so they're skipped here.)
      const stretches = [];
      for (const g of games) {
        const times = (g.pickup_times || []).map(t => new Date(t).getTime()).sort((a, b) => a - b);
        if (times.length !== g.pickups) continue;
        const marks = [new Date(g.games.start_time).getTime(), ...times, new Date(g.games.end_time).getTime()];
        for (let i = 1; i < marks.length; i++) stretches.push(Math.max(0, (marks[i] - marks[i - 1]) / 1000));
      }
      const avg = stretches.length ? stretches.reduce((a, b) => a + b, 0) / stretches.length : null;

      const tiles = [
        ["Overall", [
          ["Games", games.length],
          ["Clean games", `${Math.round(clean / games.length * 100)}%`, `${clean} with 0 pickups`],
          ["Clean streak", run, `best: ${best} in a row`],
          ["Pickups / hour", totalSec ? (pickups / (totalSec / 3600)).toFixed(1) : "—"],
          ["Time studied", dur(totalSec)],
        ]],
        ["Focus (time without touching your phone)", [
          ["Average", dur(avg)],
          ["Longest", dur(stretches.length ? Math.max(...stretches) : null), "your record"],
          ["Shortest", dur(stretches.length ? Math.min(...stretches) : null)],
        ]],
      ];
      const wrap = el("div", "");
      for (const [label, list] of tiles) {
        wrap.append(el("p", "stats-label", label));
        const grid = el("div", "stats");
        for (const [name, value, note] of list) {
          const box = el("div", "stat");
          box.append(el("b", "", value), el("span", "", name));
          if (note) box.append(el("small", "", note));
          grid.append(box);
        }
        wrap.append(grid);
      }
      $("stats").replaceWith(wrap);
    }

    function showActive(title, sub, button, href) {
      $("activeTitle").textContent = title;
      $("activeSub").textContent = sub;
      $("activeBtn").textContent = button;
      $("activeBtn").href = href;
      $("activeCard").hidden = false;
    }

    // Join with a code (letters and numbers only)
    $("joinForm").onsubmit = e => {
      e.preventDefault();
      const code = $("code").value.trim().toUpperCase();
      if (!/^[A-Z0-9]{4,12}$/.test(code)) { $("msg").textContent = "Game PINs are letters and numbers, like 4F2A9C."; return; }
      if (!Device.isPhone()) { $("msg").textContent = `Join from your phone: open buzzkill.study on your phone and enter ${code}.`; return; }
      location.href = "/join?room=" + code;
    };

    $("logout").onclick = async () => { await sb.auth.signOut(); location.href = "/"; };

    init();
  </script>
  <script type="module" src="companion.js"></script>
</body>
</html>
