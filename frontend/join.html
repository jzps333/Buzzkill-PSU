<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzzkill · Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FFFAEB; --honey: #F5D35A; --honey-deep: #E9BF2E; --sand: #F4EEDC;
      --ink: #1F1B16; --ink-2: #5E574B; --charcoal: #2B2822; --red: #E5484D;
      --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--cream);
      color: var(--ink);
      font: 600 16px/1.5 var(--font);
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    .page { width: min(420px, 100%); margin: 0 auto; padding: 20px 16px 32px; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; font-weight: 800; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; text-decoration: none; color: inherit; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--honey); display: grid; place-items: center; }
    .room { padding: 6px 12px; border-radius: 999px; background: var(--sand); font-size: 13px; letter-spacing: 1px; }

    .card { padding: 28px 20px 24px; border-radius: 26px; background: var(--honey); }
    .bee { width: 150px; margin: 0 auto 8px; }
    #status { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -.6px; }
    #hint { margin: 8px auto 0; max-width: 30ch; color: #3E3420; font-size: 15px; }
    button.main {
      width: 100%;
      height: 54px;
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      background: var(--ink);
      color: #fff;
      font: 800 17px var(--font);
      cursor: pointer;
    }
    #debug { margin-top: 24px; color: #B5AC98; font: 500 11px ui-monospace, monospace; }

    /* ---------- Busted: full screen, Buzz bounces with every shake ---------- */
    .busted {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 22px 18px 26px;
      background: var(--charcoal);
      color: #fff;
      animation: alarm 1s steps(1) infinite;
    }
    @keyframes alarm { 50% { box-shadow: inset 0 0 0 8px var(--red); } }
    .busted.done { animation: none; }
    .b-label { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: #BDB4A0; }
    .arena { position: relative; flex: 1; min-height: 220px; display: grid; place-items: center; margin: 12px 0 14px; border-radius: 22px; background: #34302A; overflow: hidden; overflow: clip; }
    .arena .bz-bee { width: 160px; }
    .b-title { margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -1px; }
    .b-roast { margin: 2px 0 16px; color: #D8D0BE; font-size: 15px; }
    .b-hint { margin: 0 0 10px; font-weight: 800; }
    .b-meter { height: 12px; border-radius: 99px; background: #4A453B; overflow: hidden; }
    .b-meter span { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--honey); transition: width .1s linear; }
    .b-secs { margin: 10px 0 0; color: #D8D0BE; font-variant-numeric: tabular-nums; }

    /* ---------- Pomodoro vote, timer, team, emergency pass ---------- */
    .vote { margin-top: 18px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.55); }
    .vote p { margin: 0 0 10px; font-size: 14px; font-weight: 800; }
    .vote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .vote-grid button { padding: 10px 8px; border: 2px solid transparent; border-radius: 12px; background: #fff; color: var(--ink); font: 700 13px var(--font); cursor: pointer; }
    .vote-grid button b { display: block; font-size: 15px; }
    .vote-grid button.picked { border-color: var(--ink); background: #FFF3C4; }
    .vote-tally { margin: 10px 0 0; font-size: 12px; color: #5A4710; }
    .phase { margin-top: 14px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.6); font-weight: 800; font-variant-numeric: tabular-nums; }
    .phase.break { background: #CDEFD9; }
    .team-tag { padding: 6px 12px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 13px; }
    .pass-btn { width: 100%; height: 48px; margin-top: 14px; border: 2px solid #fff; border-radius: 14px; background: transparent; color: #fff; font: 800 15px var(--font); cursor: pointer; }

    /* ---------- Optional SOL bet (lobby) ---------- */
    .bet { margin-top: 14px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.55); text-align: left; }
    .bet p { margin: 0 0 8px; font-size: 14px; font-weight: 800; }
    .bet small { display: block; margin-bottom: 10px; font-size: 12px; color: #5A4710; font-weight: 600; }
    .bet-row { display: flex; gap: 8px; }
    .bet-row input { flex: 1; min-width: 0; padding: 10px 12px; border: 2px solid #E8DDBF; border-radius: 12px; font: 700 16px var(--font); }
    .bet-row button { padding: 10px 14px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font: 800 14px var(--font); cursor: pointer; }
    .bet-state { margin: 10px 0 0; font-size: 13px; font-weight: 700; }

    @media (prefers-reduced-motion: reduce) { .busted { animation: none; box-shadow: inset 0 0 0 8px var(--red); } }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 3c-3.6 0-6 2.7-6 6.3V14l-2 3h16l-2-3V9.3C18 5.7 15.6 3 12 3z" fill="#1F1B16"/><circle cx="12" cy="19.5" r="2.2" fill="#1F1B16"/></svg>
        </span>
        Buzzkill
      </a>
      <span class="team-tag" id="teamTag" hidden></span>
      <span class="room" id="roomTag" hidden></span>
    </div>
    <div class="card">
      <div class="bee" id="bee"></div>
      <h1 id="status">Joining…</h1>
      <p id="hint"></p>
      <button class="main" id="start" hidden>I'm ready</button>
      <div class="phase" id="phase" hidden></div>
      <div class="vote" id="vote" hidden>
        <p>🍅 Vote: how should we study?</p>
        <div class="vote-grid">
          <button data-choice="sprint"><b>Sprint</b>15 min · 3 break</button>
          <button data-choice="classic"><b>Classic</b>25 min · 5 break</button>
          <button data-choice="deep"><b>Deep</b>50 min · 10 break</button>
          <button data-choice="none"><b>No breaks</b>until it ends</button>
        </div>
        <p class="vote-tally" id="tally"></p>
      </div>
      <div class="bet" id="bet" hidden>
        <p>💰 Optional: bet test SOL</p>
        <small>Last one standing takes the whole pot. Uses Phantom on Solana Devnet (free test SOL, not real money).</small>
        <div class="bet-row" id="betRow">
          <input id="betAmt" type="number" inputmode="decimal" min="0.01" max="5" step="0.01" value="0.05" aria-label="SOL to bet">
          <button id="betBtn">Bet with Phantom</button>
        </div>
        <p class="bet-state" id="betState"></p>
      </div>
    </div>
    <div id="debug"></div>
  </main>

  <!-- Busted: shown while YOUR alarm is on -->
  <section class="busted" id="busted" role="alert" hidden>
    <p class="b-label" id="bLabel">Pickup detected</p>
    <div class="arena" id="arena"><div id="busyBee"></div></div>
    <h2 class="b-title" id="bTitle">Busted</h2>
    <p class="b-roast" id="bRoast"></p>
    <p class="b-hint" id="bHint">Shake your phone to send Buzz away</p>
    <div class="b-meter"><span id="bFill"></span></div>
    <p class="b-secs" id="bSecs">0.0s / 10.0s</p>
    <button class="pass-btn" id="passBtn" hidden>🆘 Emergency? Use your pass (10 free minutes, once per game)</button>
  </section>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="buzz.js"></script>
  <script src="device.js"></script>
  <script>
    // Room codes are only letters and numbers. Anything else is ignored.
    const rawRoom = new URLSearchParams(location.search).get("room") || "";
    const room = /^[A-Za-z0-9]{4,12}$/.test(rawRoom) ? rawRoom.toUpperCase() : null;
    const $ = id => document.getElementById(id);

    // Buzz on the main card: happy normally, worried when something's wrong
    Buzz.bee($("bee"));
    $("bee").classList.add("bz-float");
    const show = (mood, status, hint = "") => {
      Buzz.setMood($("bee"), mood);
      $("status").textContent = status;
      $("hint").textContent = hint;
    };

    let token = null;          // login token, sent with every event
    let gameStatus = null;     // waiting / live / ended / cancelled
    let game = {};             // mode, start_time, pomo_work, pomo_break...
    let mine = {};             // my results row: team, pass, alarm...
    let me = null;             // my user id

    // ---------- 1. Send an event to Supabase (the Pi hears it instantly) ----------
    // keepalive: true lets it finish even while the page is being left
    function send(type, detail) {
      if (!token) return;
      fetch(`${SUPABASE_URL}/rest/v1/events`, {
        method: "POST",
        keepalive: true,
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json",
          Prefer: "return=minimal",
        },
        body: JSON.stringify(detail ? { game: room, type, detail } : { game: room, type }),
      });
    }

    // ---------- 2. Join ----------
    let joined = false;        // becomes true after "I'm ready" proves this is a phone

    async function join() {
      // Phones only: the phone's motion sensor is the whole game
      if (!Device.isPhone()) {
        show("worried", "Join from your phone",
             room ? `Open buzzkill.study on your phone and enter PIN ${room}.` : "Open buzzkill.study on your phone and enter the game PIN.");
        return;
      }

      const { data: { session } } = await sb.auth.getSession();
      if (!session) {                                         // not logged in → login page, then straight back here
        location.href = room ? "/login?next=" + encodeURIComponent("/join?room=" + room) : "/";
        return;
      }
      token = session.access_token;
      sb.auth.onAuthStateChange((_e, s) => { if (s) token = s.access_token; });   // keep token fresh

      const { data: g } = await sb.from("games").select("*").eq("code", room).maybeSingle();
      if (!room || !g || g.status === "ended" || g.status === "cancelled") {
        show("worried", "No game running", "Tap the brick, or enter a game PIN on buzzkill.study.");
        return;
      }
      $("roomTag").textContent = room;
      $("roomTag").hidden = false;
      game = g;
      setStatus(game.status);          // you join for real after tapping "I'm ready"
      $("start").hidden = false;

      // Watch live: the game (waiting → live → ended) and MY alarm (on/off, progress)
      me = session.user.id;
      sb.channel("game-" + room)
        .on("postgres_changes",
            { event: "UPDATE", schema: "public", table: "games", filter: `code=eq.${room}` },
            p => { game = p.new; setStatus(p.new.status); })
        .on("postgres_changes",
            { event: "*", schema: "public", table: "results", filter: `game=eq.${room}` },
            p => { if (p.new?.user_id === me) setAlarm(p.new); loadTally(); })
        .subscribe();
    }

    function setStatus(s) {
      gameStatus = s;
      if (s === "waiting" && !joined) show("happy", "Almost in", "Tap I'm ready to join this game.");
      if (s === "waiting" && joined)  show("happy", "You're in!", "Waiting for 4+ players. Then tap the brick to start.");
      if (s === "live")    show("happy", "Phones down.", "Face down on the brick. Buzz is watching.");
      $("vote").hidden = !(s === "waiting" && joined);
      $("bet").hidden = !(s === "waiting" && joined) && !betAmount;
      if (s !== "waiting") $("betRow").hidden = true;
      if (s === "live") { loadMine(); tick(); }
      if (s === "ended")   { hideBusted(); show("happy", "Game over", "Loading results…"); stopMotion(); setTimeout(() => location.href = "results?room=" + room, 2000); }
      if (s === "cancelled") { hideBusted(); stopMotion(); $("start").hidden = true; show("worried", "Game closed", "The host closed this game. Enter a new PIN on buzzkill.study."); }
    }

    // ---------- Optional SOL bet (lobby). The "sol" server function checks the payment on-chain. ----------
    let betAmount = 0, betPending = false;
    async function sol(action, extra = {}) {
      const r = await fetch(`${SUPABASE_URL}/functions/v1/sol`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` },
        body: JSON.stringify({ action, game: room, ...extra }),
      });
      return r.json();
    }
    function showBet(st) {
      if (st.status === "in" || st.status === "paid" || st.status === "lost" || st.status === "sending") {
        betAmount = Number(st.amount); betPending = false;
        $("betRow").hidden = true;
        $("bet").hidden = false;
        $("betState").textContent = `✅ You bet ${betAmount} SOL. Don't touch your phone!`;
      } else if (st.status === "refunded") {
        betPending = false;
        $("betState").textContent = "↩️ " + (st.error || "Your bet was sent back.");
      } else if (st.status === "pending") {
        betPending = true;
        $("betState").textContent = "⏳ Waiting for your payment… (approve it in Phantom, then come back here)";
      }
    }
    $("betBtn").onclick = async () => {
      const amount = Math.round(Number($("betAmt").value) * 1000) / 1000;
      if (!(amount >= 0.01 && amount <= 5)) { $("betState").textContent = "Pick between 0.01 and 5 SOL."; return; }
      $("betBtn").disabled = true;
      const r = await sol("start").catch(() => ({ error: "Couldn't reach the server" }));
      $("betBtn").disabled = false;
      if (r.error) { $("betState").textContent = r.error; return; }
      showBet({ status: "pending" });
      // Opens this game's bet page inside Phantom's own browser, where it can ask the wallet to pay
      const page = `${location.origin}/stake?game=${room}&amount=${amount}&ref=${r.reference}&pot=${r.pot}`;
      location.href = `https://phantom.app/ul/browse/${encodeURIComponent(page)}?ref=${encodeURIComponent(location.origin)}`;
    };
    async function checkBet() {
      if (!token || !room) return;
      const st = await sol("check").catch(() => null);
      if (st) showBet(st);
    }
    setInterval(() => { if (betPending && document.visibilityState === "visible") checkBet(); }, 4000);

    // ---------- Pomodoro vote (lobby) ----------
    const POMO = { sprint: [15, 3, "Sprint"], classic: [25, 5, "Classic"], deep: [50, 10, "Deep"], none: [0, 0, "No breaks"] };
    document.querySelectorAll(".vote-grid button").forEach(b => b.onclick = () => {
      document.querySelectorAll(".vote-grid button").forEach(x => x.classList.toggle("picked", x === b));
      send("vote", b.dataset.choice);
    });
    async function loadTally() {
      if (gameStatus !== "waiting") return;
      const { data } = await sb.from("results").select("pomo_vote").eq("game", room);
      const n = {};
      (data || []).forEach(r => { if (r.pomo_vote) n[r.pomo_vote] = (n[r.pomo_vote] || 0) + 1; });
      const parts = Object.entries(n).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${POMO[k]?.[2] ?? k} ${v}`);
      $("tally").textContent = `${(data || []).length} in the lobby` + (parts.length ? ` · votes: ${parts.join(", ")}` : " · no votes yet (Classic if nobody votes)");
    }

    // ---------- My row: team + emergency pass ----------
    async function loadMine() {
      const { data } = await sb.from("results").select("*").eq("game", room).eq("user_id", me).maybeSingle();
      if (data) setAlarm(data);
    }
    function showTeam() {
      const t = mine.team;
      $("teamTag").hidden = !(game.mode === "teams" && t);
      $("teamTag").textContent = t === 1 ? "🍯 Team Honey" : "🐝 Team Stingers";
    }
    const passLeft = () => mine.pass_until ? Math.max(0, (new Date(mine.pass_until) - Date.now()) / 1000) : 0;
    $("passBtn").onclick = () => { $("passBtn").hidden = true; send("pass"); };

    // ---------- Focus / break timer (every second while live) ----------
    // Same math as the database: break = the last part of each focus+break cycle, plus 15s grace after.
    function phaseNow() {
      if (gameStatus !== "live" || !game.start_time || !(game.pomo_work > 0)) return { free: false };
      const t = (Date.now() - new Date(game.start_time)) / 1000;
      const w = game.pomo_work * 60, c = (game.pomo_work + game.pomo_break) * 60, m = t % c;
      if (m >= w) return { free: true, kind: "break", left: c - m };
      if (t >= c && m < 15) return { free: true, kind: "grace", left: 15 - m };
      return { free: false, kind: "focus", left: w - m };
    }
    const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
    let wasFree = false;
    function tick() {
      if (gameStatus !== "live") { $("phase").hidden = true; return; }
      const ph = phaseNow(), pass = passLeft();
      const el = $("phase");
      el.hidden = false;
      el.classList.toggle("break", ph.kind === "break");
      const done = doneLeft();
      if (done > 0)                el.textContent = `✅ Done shaking! Phone face down in ${Math.ceil(done)}s`;
      else if (pass > 0)           el.textContent = `🆘 Emergency pass · ${mmss(pass)} left. Face down before it runs out!`;
      else if (ph.kind === "break") el.textContent = `☕ Break · ${mmss(ph.left)} left. Phones are OK!`;
      else if (ph.kind === "grace") el.textContent = `⏰ Break's over! Phones down in ${Math.ceil(ph.left)}s`;
      else if (ph.kind === "focus") el.textContent = `🍅 Focus · ${mmss(ph.left)} until break (${POMO[game.pomo_choice]?.[2] ?? ""})`;
      else                          el.textContent = "🍅 Focus · no breaks this game";
      // Free time just ended (break or pass) and the phone is still up? That's a pickup.
      const freeNow = ph.free || pass > 0 || done > 0;
      if (wasFree && !freeNow && joined && !isDown && !alarmOn) { send("pickup"); showBusted(); }
      wasFree = freeNow;
    }
    setInterval(tick, 1000);

    // ---------- Lobby: stay "in" while waiting ----------
    // While the game hasn't started, check in every 8 seconds. If this page closes or goes quiet
    // for 25 seconds, you're removed from the game. Checking in again puts you back.
    setInterval(() => { if (joined && gameStatus === "waiting") send("ping"); }, 8000);
    window.addEventListener("pagehide", () => { if (joined && gameStatus === "waiting") send("leave"); });

    // ---------- 3. BUSTED: shake to silence it (10s, then 30s, 1 min, +30s each pickup), Buzz bounces on every shake ----------
    // 7.5 -> "7.5s", 90 -> "1:30"
    const clock = s => s < 60 ? `${s.toFixed(1)}s` : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
    // The database measures shaking time from the "shake" messages (about 2 a second while
    // you shake) and decides when you're done. This screen shows the same clock with Buzz.
    let shakeSeconds = 10;     // replaced by the database's shake_secs_needed
    const TICK_MS = 500;       // one "shake" message per half second of shaking
    const ROASTS = [
      "Your textbook misses you. Buzz noticed.",
      "That notification was not an emergency.",
      "Bold move, during finals.",
      "Everyone at the table saw that.",
      "Buzz is disappointed. Mostly in you.",
    ];
    const busyBee = $("busyBee");
    Buzz.bee(busyBee, "worried");
    let bustedOn = false;
    let shaking = false, lastShakeAt = 0;

    const meter = Buzz.meter({
      seconds: shakeSeconds,
      tickMs: TICK_MS,
      onProgress: (f, ms) => {
        $("bFill").style.width = (f * 100).toFixed(1) + "%";
        $("bSecs").textContent = `${clock(ms / 1000)} / ${clock(shakeSeconds)}`;
      },
      onTick: () => send("shake"),           // the database adds up shaking time and turns the alarm off
      onDone: () => {
        $("busted").classList.add("done");
        Buzz.home(busyBee);
        Buzz.setMood(busyBee, "happy");
        busyBee.classList.remove("bz-panic");
        $("bTitle").textContent = "Silenced";
        $("bHint").textContent = "Buzz flew off. Put your phone back face down.";
        // If a tick got lost on the network, top it up until the database agrees
        let extra = 0;
        clearInterval(topUp);
        topUp = setInterval(() => {
          if (!alarmOn || ++extra > 6) { clearInterval(topUp); return; }
          send("shake");
        }, 600);
      },
    });
    let topUp = null;

    async function showBusted() {
      if (bustedOn) return;
      bustedOn = true;
      // Teams: busted because a teammate picked up?
      const byTeammate = mine.alarm_cause && mine.alarm_cause !== me && mine.alarm_on;
      $("bLabel").textContent = byTeammate ? "Your teammate picked up" : "Pickup detected";
      $("passBtn").hidden = byTeammate || !!mine.pass_used;
      if (byTeammate) {
        const { data: p } = await sb.from("profiles").select("username").eq("id", mine.alarm_cause).maybeSingle();
        $("bRoast").textContent = `${p?.username ?? "A teammate"} slipped, so your whole team has to shake.`;
      }
      shaking = false;
      meter.reset();
      meter.start();
      $("busted").classList.remove("done");
      $("bTitle").textContent = "Busted";
      if (!byTeammate) $("bRoast").textContent = ROASTS[Math.floor(Math.random() * ROASTS.length)];
      $("bHint").textContent = "Shake your phone to send Buzz away";
      Buzz.home(busyBee);
      Buzz.setMood(busyBee, "worried");
      busyBee.classList.add("bz-panic");
      $("busted").hidden = false;
      if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
    }

    function hideBusted() {
      bustedOn = false;
      clearInterval(topUp);
      meter.stop();
      $("busted").hidden = true;
    }

    function onShake() {
      if (!bustedOn || $("bTitle").textContent !== "Busted") return;
      meter.jolt();
      lastShakeAt = Date.now();
      if (!shaking) { shaking = true; $("bHint").textContent = "Keep going! The alarm is paused while you shake."; }
      Buzz.bounce(busyBee, $("arena"));
    }

    // Stopped shaking early? No hard shake for 1.2 seconds = the sound comes back.
    setInterval(() => {
      if (shaking && Date.now() - lastShakeAt > 1200) {
        shaking = false;
        if (bustedOn && $("bTitle").textContent === "Busted") {
          $("bHint").textContent = "You stopped, so the alarm is back. Keep shaking!";
          if (alarmOn) send("shake_stop");
        }
      }
    }, 300);

    // The database decides when your alarm is really on or off
    let alarmOn = false;
    // After you finish shaking you get 5 seconds to put the phone down (the database gives the same 5 seconds)
    let doneUntil = 0;
    const doneLeft = () => Math.max(0, (doneUntil - Date.now()) / 1000);
    function setAlarm(r) {
      mine = r;
      showTeam();
      const wasOn = alarmOn;
      alarmOn = r.alarm_on && gameStatus === "live";
      if (wasOn && !alarmOn && passLeft() === 0) { doneUntil = Date.now() + 5000; tick(); }
      if (alarmOn) {
        if (bustedOn) $("passBtn").hidden = !!r.pass_used || r.alarm_cause !== me;
        showBusted();
        if (r.shake_secs_needed && Number(r.shake_secs_needed) !== shakeSeconds) {
          shakeSeconds = Number(r.shake_secs_needed);
          meter.setSeconds(shakeSeconds);
        }
        meter.sync(Number(r.shake_secs_done || 0) * 1000);   // stay in step with the database's clock
      } else if (gameStatus === "live" && passLeft() > 0) {
        hideBusted();
        show("happy", "Emergency pass on", "Take care of it. Pickups don't count for 10 minutes.");
        tick();
      } else if (gameStatus === "live") {
        hideBusted();
        show("happy", "Alarm off", `Pickup #${r.pickups} counted. You have 5 seconds to put it back face down.`);
      }
    }

    // ---------- 4. "I'm ready" button: permissions ----------
    $("start").onclick = async () => {
      // iPhone needs a button tap to allow motion. Android skips this.
      if (typeof DeviceMotionEvent?.requestPermission === "function") {
        if (await DeviceMotionEvent.requestPermission() !== "granted") {
          show("worried", "Motion access needed", "Reload and tap Allow.");
          return;
        }
      }

      // Real check: does this device actually have a motion sensor? Laptops don't.
      $("start").disabled = true;
      $("hint").textContent = "Checking your phone's motion sensor…";
      if (!await Device.hasMotionSensor()) {
        $("start").disabled = false;
        show("worried", "No motion sensor found", "Buzzkill only works on a phone. Open this page on your phone.");
        return;
      }
      send("join");
      joined = true;
      checkBet();
      setStatus(gameStatus);
      setTimeout(loadTally, 800);

      await keepAwake();
      window.addEventListener("devicemotion", onMotion);
      $("start").hidden = true;
      $("hint").textContent = "Now put your phone face down.";
    };

    // ---------- 5. Motion: pickup + shake ----------
    let baseline = null, isDown = false, lastPickup = 0, lastJolt = 0;

    function onMotion(e) {
      const g = e.accelerationIncludingGravity;
      if (!g || g.x === null) return;
      const v = [g.x, g.y, g.z];

      // 5a. Remember which way gravity points when the phone first lies flat
      if (!baseline) {
        if (Math.abs(g.z) > 9) { baseline = v; isDown = true; $("hint").textContent = "Locked in. Don't touch it."; }
        return;
      }

      // 5b. Pickup: compare gravity now vs. lying flat (cosine similarity)
      const sim = cosine(v, baseline);
      if (isDown && sim < 0.7) {                         // tilted more than ~45°
        isDown = false;
        if (gameStatus === "live" && Date.now() - lastPickup > 2000 && !phaseNow().free && passLeft() === 0 && doneLeft() === 0) {
          lastPickup = Date.now();
          send("pickup");
          showBusted();                                   // show Buzz right away; the database confirms
        }
      } else if (!isDown && sim > 0.95) {                 // back flat
        isDown = true;
        if (gameStatus === "live" && !alarmOn && !bustedOn) show("happy", "Phones down.", "Face down on the brick. Buzz is watching.");
      }

      // 5c. Shake: every hard jolt bounces Buzz and keeps the 10-second clock running
      const a = e.acceleration;
      const strength = (a && a.x !== null) ? Math.hypot(a.x, a.y, a.z) : Math.abs(Math.hypot(...v) - 9.8);
      const now = performance.now();
      if (strength > 13 && now - lastJolt > 110) { lastJolt = now; onShake(); }

      $("debug").textContent = `sim ${sim.toFixed(2)} · force ${strength.toFixed(1)}`;
    }

    function cosine(a, b) {
      const dot = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      return dot / (Math.hypot(...a) * Math.hypot(...b));
    }

    function stopMotion() { window.removeEventListener("devicemotion", onMotion); }

    // ---------- 6. Keep the screen on ----------
    async function keepAwake() { try { await navigator.wakeLock.request("screen"); } catch {} }

    // ---------- 7. Leaving the page counts as a pickup ----------
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        if (gameStatus === "live") send("left_page");
        if (gameStatus === "waiting" && joined) send("leave");    // closed or left before the start: out of the lobby
      } else {
        keepAwake();   // the browser drops the wake lock when you leave
        if (gameStatus === "waiting" && joined) send("ping");     // came back before the start: back in the lobby
        if (betPending) checkBet();                                 // back from Phantom: did the bet arrive?
      }
    });

    join();
  </script>
</body>
</html>
